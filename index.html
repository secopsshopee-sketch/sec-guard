<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ═══ หน้าแรก (ธีม Hub เดิม) ═══ */
body.t-hub{background:#f1efea}
.top{padding:18px 18px 8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:36px;height:36px;border-radius:10px;background:#e8622c;color:#fff;display:grid;place-items:center;font:700 16px 'Prompt',sans-serif}
.brand b{font:600 18px 'Prompt',sans-serif;display:block;line-height:1.2}
.brand small{color:#7a8190;font-size:12px}
.brand small button{border:0;background:none;color:#e8622c;font-weight:700;font-size:12px;cursor:pointer;padding:0;text-decoration:underline}
.time{text-align:right;font-variant-numeric:tabular-nums}
.time b{display:block;font:600 20px 'Prompt',sans-serif;line-height:1.1}
.time small{color:#7a8190;font-size:11.5px}
.sec{padding:12px 18px 4px;font-size:12px;font-weight:700;color:#7a8190;letter-spacing:.04em}
.bento{padding:6px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.b{border:0;border-radius:18px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-height:112px;transition:transform .12s;text-align:left;cursor:pointer;font:inherit}
.b:active{transform:scale(.97)}
.b b{font:600 16px 'Prompt',sans-serif;line-height:1.25}
.b small{display:block;font:400 12px 'IBM Plex Sans Thai',sans-serif;opacity:.85;margin-top:2px}
.b.big{background:#e8622c;color:#fff;box-shadow:0 6px 16px rgba(232,98,44,.28)}
.b.big.tall{grid-row:span 2;min-height:234px}
.b.big b{font-size:22px}
.b.big .ic{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.2);display:grid;place-items:center}
.b.big .svg{width:28px;height:28px}
.b.wide{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:flex-start;min-height:0}
.red{background:#fdeaea;color:#c53030}.blue{background:#e5eefc;color:#2f6fd6}.green{background:#e4f4ea;color:#1f8a4c}.amber{background:#fbf0dc;color:#a86a12}.slate{background:#e8ecf2;color:#3d4a5c}
.notice{margin:8px 14px 0;background:#fbf0dc;border:1px solid #efd6a6;border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;color:#6b4a0f}
.notice b{font-weight:700}
.notice button{align-self:flex-start;border:0;background:#a86a12;color:#fff;border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer}
.voice{margin:14px 14px 4px;width:calc(100% - 28px);background:#fff;border:1px dashed #e6e3dc;border-radius:18px;padding:14px 16px;display:flex;gap:14px;align-items:center;font:inherit;text-align:left;cursor:pointer}
.voice .ic{width:44px;height:44px;border-radius:12px;background:#eee9fb;color:#6d4fc2;display:grid;place-items:center;flex:none}
.voice b{font-weight:600;font-size:15px;display:block}.voice small{color:#7a8190;font-size:12.5px}
body.t-vo{--accent:#e8462b;--accent2:#ff6a3d;--accent-dim:rgba(232,70,43,.08);--border:#e3e3e8;--surface2:#fff;--muted:#6b6f7b;--subtle:#9a9eaa;background:#f3f3f5;color:#1f2328}
.vo-head{background:#fff;border-bottom:3px solid #e8462b;padding:14px 16px;display:flex;align-items:center;gap:12px}
.vo-ic{width:40px;height:40px;border-radius:10px;background:#e8462b;color:#fff;display:grid;place-items:center}
.vo-head .vt{font-weight:700;font-size:17px}.vo-head .vs{font-size:12.5px;color:#6b6f7b}
.vo-main{padding:16px 16px 60px}
.vo-note{background:#fdecea;border-radius:12px;padding:12px 14px;font-size:14px;color:#b42318;margin-bottom:14px;line-height:1.6}
.vo-card{background:#fff;border:1px solid #e3e3e8;border-radius:14px;padding:14px;margin-bottom:14px}
.vo-l{font-size:13px;color:#4b5160;font-weight:600;margin-bottom:10px}.vo-l i{color:#d64545;font-style:normal}
.opt{color:#9a9eaa;font-weight:400;font-size:12px}
body.t-vo .field input,body.t-vo .field textarea{width:100%;padding:12px 14px;background:#fff;border:1.5px solid #e3e3e8;border-radius:10px;font-size:15px;outline:none}
body.t-vo .field input:disabled{background:#f5f5f7;color:#6b6f7b}
.vo-chk{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}.vo-chk input{width:18px;height:18px;accent-color:#e8462b}
.vo-urg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.vo-urg button{padding:10px;border-radius:10px;border:1.5px solid #e3e3e8;background:#fff;font-weight:600;cursor:pointer}
.vo-urg button.on{border-color:#e8462b;background:#fdecea;color:#b42318}
.vo-submit{width:100%;padding:15px;border:0;border-radius:14px;background:#e8462b;color:#fff;font:600 17px 'Prompt','IBM Plex Sans Thai',sans-serif;cursor:pointer}
.vo-submit:disabled{opacity:.5}
.b.wide{gap:14px}
body.t-bl{background:#f5f5f6;color:#1f2328}
.bl-head{background:#fff;border-bottom:3px solid #ee4d2d;padding:12px 16px;display:flex;align-items:center;gap:12px}
.bl-logo{width:38px;height:38px;border-radius:50%;border:2.5px solid #ee4d2d;color:#ee4d2d;display:grid;place-items:center;font:800 11px 'Prompt',sans-serif}
.bl-head .bs{font-size:11px;color:#7a8190;letter-spacing:.06em}.bl-head .bt{font:600 16px 'Prompt',sans-serif}
.bl-main{padding:16px 14px 40px;display:flex;flex-direction:column;gap:12px}
.bl-card{background:#fff;border:1px solid #e6e6ea;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.bl-l{font-size:12.5px;font-weight:700;color:#4b5160}
.bl-in{width:100%;padding:14px;border:2px solid #1f2328;border-radius:12px;font-size:19px;letter-spacing:.06em;outline:none}
.bl-in:focus{border-color:#ee4d2d}
.bl-hint{font-size:12.5px;color:#7a8190}
.bl-btn{width:100%;padding:15px;border:0;border-radius:12px;background:#ee4d2d;color:#fff;font:600 17px 'Prompt',sans-serif;cursor:pointer}.bl-btn:disabled{opacity:.6}
.res{border-radius:14px;overflow:hidden;border:1px solid var(--rb);background:#fff}
.res .h{background:var(--rc);color:#fff;padding:13px 15px;font-weight:700;font-size:16.5px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.res .h small{font-weight:500;font-size:11.5px;opacity:.92}
.res .b{padding:13px 15px;display:grid;grid-template-columns:86px 1fr;gap:12px;align-items:start}.res .b.np{grid-template-columns:1fr}
.res .av{width:86px;height:86px;object-fit:cover;border-radius:10px;border:1px solid #ddd}
.res .nm{font-weight:700;font-size:15.5px}.res .m{color:#5b6170;font-size:13px;line-height:1.55}
.res .do{background:var(--rbg);color:var(--rt);padding:11px 15px;font-size:13px;line-height:1.6;border-top:1px solid var(--rb)}.res .do b{display:block;font-size:11px;letter-spacing:.06em}
.r-no{--rc:#dc2626;--rb:#fecaca;--rbg:#fef2f2;--rt:#991b1b}.r-ok{--rc:#16a34a;--rb:#bbf7d0;--rbg:#f0fdf4;--rt:#14532d}.r-was{--rc:#475569;--rb:#cbd5e1;--rbg:#f8fafc;--rt:#334155}
.ph-seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px}.ph-seg button{border:1.5px solid #d6d9de;background:#fff;border-radius:10px;padding:10px;font:600 15px 'Prompt',sans-serif;color:#1f2328;cursor:pointer}.ph-seg button.on{background:#1f2a44;color:#fff;border-color:#1f2a44}
.ph-imei{font-family:ui-monospace,Menlo,monospace;letter-spacing:.05em}.ph-imei em{font-style:normal;background:#fff1b8;border-radius:3px;padding:0 2px}
.ph-recent{font-size:12.5px;color:#4b5563;display:flex;flex-direction:column;gap:3px}.ph-pick{display:block;width:100%;text-align:left;border:1px solid #e5e7eb;background:#fff;border-radius:10px;padding:9px 11px;margin-bottom:6px;font:inherit;cursor:pointer}
.gp-items{display:flex;flex-direction:column;gap:6px;margin-top:4px}.gp-it{display:flex;gap:10px;align-items:center;border:1px solid #e5e7eb;border-radius:10px;padding:9px 10px;font-size:14px;cursor:pointer}.gp-it input{width:22px;height:22px;accent-color:#16a34a;flex:none}.gp-it b{margin-left:auto;white-space:nowrap}.gp-it small{color:#6b7280;font-family:ui-monospace,Menlo,monospace}
.gp-shot{border:1.5px dashed #d6d9de;background:#fff;border-radius:12px;padding:12px;font:inherit;font-size:14px;cursor:pointer}.gp-thumbs{display:flex;gap:6px;flex-wrap:wrap}.gp-thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid #ddd;cursor:pointer}
.gtoast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2328;color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;display:none;z-index:400;max-width:90%}
.foot{color:#7a8190;font-size:11.5px;text-align:center;padding:14px}
.sitebtn{margin:6px 14px;width:calc(100% - 28px);background:#fff;border:1px solid #e6e3dc;border-radius:18px;padding:16px;display:flex;justify-content:space-between;align-items:center;font:inherit;cursor:pointer;text-align:left}
.sitebtn b{font:600 17px 'Prompt',sans-serif}
.sitebtn.near{border:2px solid #e8622c;background:#fff4ee}

/* ═══ ลงเวลา (ธีมเช็คกำลังพลเดิม) ═══ */
body.t-ci{background:#e6e8ec;color:#111}
.ci-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.ci-head .ht{font:600 20px 'Prompt',sans-serif}
.ci-head .hs{font-size:12.5px;color:#4b5160}
.pill-back{font-size:13px;color:#111;background:#fff;box-shadow:0 1px 3px rgba(17,17,17,.1);border-radius:999px;padding:6px 12px;font-weight:600;border:1px solid #cfd4dc;cursor:pointer}
.ci-main{padding:6px 14px 40px}
.ci-bento{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.t{border-radius:20px;padding:14px;background:#fff;box-shadow:0 1px 3px rgba(17,17,17,.08);display:flex;flex-direction:column;gap:6px;min-width:0}
.span2{grid-column:span 2}
.clockt{background:#111;color:#fff;min-height:116px;justify-content:space-between}
.clockt small{color:#a3a3a3;font-size:12px}
.clockt .bt{font:600 46px/1 'Prompt',sans-serif;font-variant-numeric:tabular-nums}
.clockt .bd{font-size:13px;color:#cfcfcf}
.gpst{background:#d3e0ff;border:1px solid #b7c9f5;flex-direction:row;align-items:center;gap:10px;font-size:14px;color:#1e3a8a;font-weight:600;line-height:1.35}
.gpst.bad{background:#fde7e5;border-color:#f4b4ad;color:#9b1c13}
.gpst.ok{background:#dcf5e6;border-color:#97dcb4;color:#0a6b3d}
.dot{width:10px;height:10px;border-radius:50%;background:#9aa3b5;flex-shrink:0}
.dot.wait{background:#e39a1c;animation:pulse 1.2s infinite}.dot.ok{background:#16a34a}.dot.bad{background:#d92d20}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.start-title{font:600 18px 'Prompt',sans-serif;margin:6px 2px 8px}
.start{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.start-btn{border:none;border-radius:20px;padding:16px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;cursor:pointer;font-family:inherit;transition:transform .1s}
.start-btn:active{transform:scale(.97)}
.start-btn .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff}
.start-btn .t2{font:600 24px/1.1 'Prompt',sans-serif}
.start-btn .d{font-size:12.5px;opacity:.75}
.start-btn.in{background:#c9f0d9;color:#0a6b3d}.start-btn.in .ic{background:#16a34a}
.start-btn.out{background:#ffdcc4;color:#b33a0b}.start-btn.out .ic{background:#ff5a1f}
.mode-bar{border-radius:20px;padding:14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mode-bar small{font-size:12px;opacity:.75;display:block}
.mode-bar b{font:600 22px 'Prompt',sans-serif}
.mode-bar.in{background:#c9f0d9;color:#0a6b3d;border:1px solid #97dcb4}
.mode-bar.out{background:#ffdcc4;color:#b33a0b;border:1px solid #f7b48d}
.mode-bar button{background:#fff;border:none;color:inherit;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer}
.ci-card{background:#fff;border-radius:20px;padding:16px 14px;margin-bottom:10px;display:flex;flex-direction:column;gap:12px;border:1px solid #cfd4dc;box-shadow:0 2px 6px rgba(17,17,17,.06)}
.ci-card .tl{font:600 16px 'Prompt',sans-serif;padding-bottom:8px;border-bottom:1px solid #eceef2}
body.t-ci .field label{font-size:13.5px;color:#2b303b;font-weight:600}
body.t-ci .field input,body.t-ci .field select{background:#fff;border:1.5px solid #c3c9d3;border-radius:12px;padding:12px;font-size:15px}
body.t-ci .field input:focus,body.t-ci .field select:focus{border-color:#1d4ed8;box-shadow:0 0 0 3px rgba(29,78,216,.15)}
.camera-box{background:#ffdcc4;border:1.5px dashed #f39a63;border-radius:20px;overflow:hidden;cursor:pointer;position:relative}
.camera-ph{display:flex;align-items:center;gap:12px;padding:14px}
.camera-ic{width:48px;height:48px;border-radius:14px;background:#ff5a1f;color:#fff;display:grid;place-items:center;font-size:22px;flex-shrink:0}
.camera-hint{font-size:12.5px;color:#8a4a2a}
.camera-hint strong{display:block;font:600 16px 'Prompt',sans-serif;color:#b33a0b}
.camera-box img{width:100%;display:block}
.retake{position:absolute;top:10px;right:10px;background:rgba(17,17,17,.75);color:#fff;border:none;border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer}
.lockline{font-size:12px;color:#4b5160;text-align:center;margin:8px 0 10px;font-variant-numeric:tabular-nums}
.ci-submit{width:100%;padding:16px;background:#111;color:#fff;border:none;border-radius:20px;font:600 17px 'Prompt','IBM Plex Sans Thai',sans-serif;cursor:pointer}
.ci-submit.out{background:#ff5a1f}
.ci-submit:disabled{opacity:.4}

/* ═══ ฟอร์มรายงาน (ธีมส้ม SPX / ฟ้า Parcel เดิม) ═══ */
body.t-or{--accent:#ee4d2d;--accent2:#ff7337;--accent-dim:rgba(238,77,45,.10);--bg:#fff6f1;--surface2:#fffaf7;--border:#f0d5c7;--text:#26180f;--muted:#7d6556;--subtle:#a48d7e;--shadow:0 2px 10px rgba(120,60,30,.08);background:var(--bg);color:var(--text)}
body.t-pf{--accent:#0ea5e9;--accent2:#38bdf8;--accent-dim:rgba(14,165,233,.10);--bg:#f1f8fc;--surface2:#f7fbfe;--border:#cfe6f3;--text:#0c2a3d;--muted:#55707f;--subtle:#86a1b0;--shadow:0 2px 10px rgba(14,80,120,.08);background:var(--bg);color:var(--text)}
.header{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:16px 18px 30px;display:flex;align-items:center;gap:12px}
body.t-pf .header{background:linear-gradient(135deg,var(--accent2),var(--accent))}
.hicon{background:rgba(255,255,255,.22);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;font:700 14px 'Kanit',sans-serif;flex-shrink:0;border:0;color:#fff;cursor:pointer}
.htitle{font:600 20px 'Kanit','IBM Plex Sans Thai',sans-serif;line-height:1.2}
.hsub{font-size:12px;color:rgba(255,255,255,.88)}
.hclock{margin-left:auto;text-align:right;line-height:1.25;font-variant-numeric:tabular-nums}
.hclock .ht{font-size:18px;font-weight:700}
.hclock .hd{font-size:11px;color:rgba(255,255,255,.85)}
.fmain{padding:0 16px 60px;margin-top:-14px}
.tsb{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border-radius:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.tsb .tt{font-size:12.5px;color:var(--muted)}
.tsb strong{font-size:14px;font-variant-numeric:tabular-nums;display:block}
.tsb .tl{margin-left:auto;font-size:12px;color:var(--subtle);text-align:right}
.tsb .tl button{border:0;background:var(--accent-dim);color:var(--accent);border-radius:999px;padding:4px 10px;font-weight:700;font-size:12px;cursor:pointer;margin-top:2px}
.gpsb{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);margin-bottom:14px;font-size:13px;color:var(--muted)}
.section{background:#fff;border-radius:16px;padding:16px 14px 8px;margin-bottom:14px;box-shadow:var(--shadow)}
.slabel{font:600 15px 'Kanit','IBM Plex Sans Thai',sans-serif;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.slabel .cnt{background:var(--accent);color:#fff;border-radius:9px;font-size:12px;padding:0 8px;font-family:'IBM Plex Sans Thai',sans-serif}
.field{margin-bottom:12px;display:flex;flex-direction:column;gap:5px}
.field label{font-size:13.5px;font-weight:600}
.field label i{color:#d64545;font-style:normal}
body.t-or .field input,body.t-or .field select,body.t-or .field textarea,body.t-pf .field input,body.t-pf .field select,body.t-pf .field textarea{width:100%;padding:12px 14px;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;font-size:15px;outline:none;resize:vertical}
body.t-or .field input:focus,body.t-or .field select:focus,body.t-or .field textarea:focus,body.t-pf .field input:focus,body.t-pf .field textarea:focus{border-color:var(--accent);background:#fff}
.field textarea{min-height:90px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2>*{min-width:0}
.field input,.field select,.field textarea{width:100%;min-width:0}
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.type-btn{padding:10px 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface2);font-size:13.5px;cursor:pointer;text-align:left;font-weight:600;color:var(--text)}
.type-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.type-btn.tall{text-align:center;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.type-btn.tall .e{font-size:26px;line-height:1}
.type-btn.span{grid-column:span 2}
.lvl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.lvl button{padding:11px 4px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface2);font-weight:700;cursor:pointer}
.lvl button.on[data-v="Minor"]{background:#e8ecf2;border-color:#3d4a5c;color:#3d4a5c}
.lvl button.on[data-v="Major"]{background:#fbf0dc;border-color:#b7791f;color:#8a5a0b}
.lvl button.on[data-v="Emergency"]{background:#fde8e6;border-color:#d64545;color:#b42318}
.hint{font-size:12.5px;color:var(--subtle);margin-bottom:12px}
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pchip{padding:8px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface2);color:var(--muted);font-size:14px;cursor:pointer}
.pchip.on{border-color:var(--accent);background:var(--accent-dim);color:var(--text);font-weight:600}

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// ── เปิดได้ 2 แบบ ──
// 1) ในเว็บแอป Apps Script (ลิงก์ /exec) → ใช้ google.script.run ตามปกติ (แต่ Google ปิดกล้องสด → ใช้โหมดถ่ายรูป)
// 2) หน้าเว็บนอก Apps Script เช่น GitHub Pages → ส่งคำสั่งไปที่ SEC_API (doPost ของแอป รปภ.) · กล้องสดใช้ได้
const SEC_API = window.SEC_API_URL || (((document.querySelector('meta[name="sec-api"]') || {}).content || '').trim()).replace(/^.*วาง.*$/, '');   // ลิงก์ /exec ของแอป รปภ. (ใส่ใน <meta name="sec-api"> ของไฟล์หน้าเว็บภายนอก)
const IN_GAS = !!(window.google && google.script && google.script.run);
const run = (fn, ...a) => IN_GAS
  ? new Promise((ok, no) => google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](...a))
  : (SEC_API ? fetch(SEC_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: a }) })
      .then(r => r.text()).then(t => { let o; try { o = JSON.parse(t); } catch (e) { throw new Error('ระบบไม่ตอบ (ตรวจลิงก์ SEC_API / Deploy แอป รปภ. เป็น New version)'); } if (!o.ok) throw new Error(o.err); return o.v; })
      .catch(e => { throw (e && e.message === 'Failed to fetch') ? new Error('เชื่อมต่อไม่ได้ · ตรวจอินเทอร์เน็ต แล้วลองใหม่') : e; })
    : Promise.reject(new Error('ยังไม่ได้ใส่ลิงก์ SEC_API ในไฟล์หน้าเว็บ')));
const getLoc = () => new Promise(ok => { if (window.SEC_PARAMS) ok({ parameter: window.SEC_PARAMS, hash: '' }); else if (IN_GAS && google.script.url) google.script.url.getLocation(ok); else { const p = {}; new URLSearchParams(location.search).forEach((v, k) => p[k] = v); ok({ parameter: p, hash: location.hash.replace(/^#/, '') }); } });
const errText = e => String((e && e.message) || e).replace(/^Error:\s*/, '');
const store = { get(k) { try { return localStorage.getItem('sec_' + k) || ''; } catch (e) { return ''; } }, set(k, v) { try { localStorage.setItem('sec_' + k, v); } catch (e) {} } };
const pad = n => String(n).padStart(2, '0');
const TH_D = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'], TH_M = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const thDate = d => TH_D[d.getDay()] + ' ' + d.getDate() + ' ' + TH_M[d.getMonth()] + ' ' + (d.getFullYear() + 543);
const hms = d => pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const stamp = d => ymd(d) + ' ' + hms(d);
const ico = (id, cls) => '<svg class="svg ' + (cls || '') + '"><use href="#' + id + '"/></svg>';
setInterval(() => { const d = new Date(); document.querySelectorAll('.lt').forEach(e => e.textContent = hms(d)); document.querySelectorAll('.lth').forEach(e => e.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes())); document.querySelectorAll('.ld').forEach(e => e.textContent = thDate(d)); }, 1000);

let BL_ONLY = false, QR_SITE = '', QR_POST = '', QR_GO = '', B = null, SITE = null, CFG = null, GPS = { lat: null, lng: null, st: 'wait' };
const deviceId = (() => { let d = store.get('device'); if (!d) { d = 'D' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); store.set('device', d); } return d; })();
function theme(t) { document.body.className = t; window.scrollTo(0, 0); }

// ── เริ่ม ──
Promise.all([run('gBoot'), getLoc()]).then(([b, loc]) => {
  B = b;
  // เข้าลิงก์ / สแกน QR → เริ่มที่หน้าเลือกพื้นที่ประจำการเสมอ (พื้นที่จาก QR หรือที่ใช้ล่าสุดขึ้นเป็นตัวแนะนำ)
  QR_SITE = (loc && loc.parameter && loc.parameter.site) || '';
  QR_POST = (loc && loc.parameter && loc.parameter.post) || '';
  QR_GO = (loc && loc.parameter && loc.parameter.go) || '';
  if (QR_GO === 'blonly') { BL_ONLY = true; QR_GO = 'bl'; }   // ลิงก์ตรวจ BlackList หน้าเดียว · ไม่มีปุ่มกลับหน้าแรก / เมนูอื่น   // ลิงก์ตรงเข้าฟอร์ม (จากหน้ารวมลิงก์) · ยังเริ่มที่หน้าเลือกพื้นที่ก่อน
  watchGPS();
  if (BL_ONLY && QR_SITE && B.sites.some(s => s.code === QR_SITE)) openSite(QR_SITE); else pickSite();
}).catch(e => fatal(errText(e)));

function fatal(t) { theme('t-hub'); $('app').innerHTML = '<div style="padding:40px 18px;text-align:center"><div class="overlay-icon">⚠️</div><div class="overlay-title">เปิดไม่สำเร็จ</div><div class="overlay-sub">' + esc(t) + '</div><button class="overlay-btn" onclick="location.reload()">ลองใหม่</button></div>'; }

// ── GPS ──
function watchGPS() {
  if (!navigator.geolocation) { GPS.st = 'bad'; return; }
  navigator.geolocation.watchPosition(p => { GPS = { lat: p.coords.latitude, lng: p.coords.longitude, st: 'ok' }; gpsUI(); },
    () => { GPS.st = 'bad'; gpsUI(); }, { enableHighAccuracy: true, maximumAge: 30000, timeout: 20000 });
}
function dist(a, b) { if (!a || !a.lat || !b.lat) return null; const R = 6371000, r = x => x * Math.PI / 180, dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng); const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); }
function gpsInfo() {
  if (GPS.st === 'bad') return { c: 'bad', t: '❌ GPS ถูกปฏิเสธ — เปิด Settings → Chrome → Permissions → Location (ยังส่งได้ แต่จะบันทึกว่าไม่มีพิกัด)' };
  if (GPS.st === 'ok') { const d = dist(SITE, GPS); if (d !== null && d > SITE.radius) return { c: 'bad', t: '⚠️ อยู่นอกพื้นที่ ' + SITE.code + ' ประมาณ ' + Math.round(d) + ' ม.' }; return { c: 'ok', t: '✅ ระบุตำแหน่งได้แล้ว · ' + SITE.code }; }
  return { c: 'wait', t: 'กำลังระบุตำแหน่ง...' };
}
function gpsUI() {
  const g = gpsInfo();
  document.querySelectorAll('.gpst').forEach(el => { el.className = 't span2 gpst ' + g.c; el.innerHTML = '<span class="dot ' + g.c + '"></span><span>' + esc(g.t) + '</span>'; });
  document.querySelectorAll('.gpsb').forEach(el => el.innerHTML = '<span class="dot ' + g.c + '"></span><span>' + esc(g.t) + '</span>');
}

// ── ป๊อปอัป ──
function ov(html) { $('ovBox').innerHTML = html; $('ov').classList.add('show'); }
function ovClose() { $('ov').classList.remove('show'); }
function busy(t) { ov('<div class="spinner"></div><div class="overlay-title" id="busyT">' + esc(t) + '</div><div class="prog" id="prog" style="display:none"><div id="progBar"></div></div>'); }
function busyT(t, pct) { if ($('busyT')) $('busyT').textContent = t; if (pct !== undefined && $('prog')) { $('prog').style.display = 'block'; $('progBar').style.width = pct + '%'; } }
function showErr(t) { ovClose(); const e = $('err'); if (!e) return alert(t); e.textContent = t; e.style.display = t ? 'block' : 'none'; if (t) e.scrollIntoView({ block: 'center', behavior: 'smooth' }); }

// ═══════════════ เลือกพื้นที่ / หน้าแรก ═══════════════
function pickSite() {
  theme('t-hub');
  const near = GPS.st === 'ok' ? B.sites.map(s => ({ s: s, d: dist(s, GPS) })).filter(x => x.d !== null && x.d <= x.s.radius).sort((a, b) => a.d - b.d)[0] : null;
  const has = c => B.sites.some(s => s.code === c);
  const qr = has(QR_SITE) ? QR_SITE : '', last = has(store.get('site')) ? store.get('site') : '';

$('camIn').addEventListener('change', async e => {

function shrink(file, max, q) {
  return new Promise((ok, no) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', q)); };
    img.onerror = () => no(new Error('อ่านรูปไม่ได้'));
    img.src = url;
  });
}

const readURL = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(f); });
async function uploadAll(items, kind) {
  const ids = [];
  for (let i = 0; i < items.length; i++) {
    busyT('กำลังอัปโหลด ' + (i + 1) + '/' + items.length + '…', Math.round(i / items.length * 100));
    const r = await run('uploadPending', await items[i].get(), items[i].name, SITE.code, kind);
    ids.push({ id: r.id, mime: r.mime, name: items[i].name });
  }
  busyT('กำลังส่งรายงาน…', 100);
  return ids;
}
async function sendIncident() {
  const place = $('in_pl').value === 'อื่นๆ' ? ($('in_plx').value.trim() || 'อื่นๆ') : $('in_pl').value;
  const parcels = $('in_par').value.split(/[\s,]+/).map(s => s.trim()).filter(Boolean);
  if (!$('in_d').value || !$('in_t').value) return showErr('⚠️ กรุณาใส่วันและเวลาเกิดเหตุ');
  if (!IN.type) return showErr('⚠️ กรุณาเลือกประเภทเหตุการณ์');
  if (!place) return showErr('⚠️ กรุณาเลือกสถานที่เกิดเหตุ');
  if (parcels.length && !IN.products.length) return showErr('⚠️ กรุณาเลือกประเภทสินค้าของพัสดุ');
  if (!$('in_rep').value.trim()) return showErr('⚠️ กรุณาใส่ชื่อและช่องทางติดต่อผู้รายงาน');
  showErr(''); busy('กำลังส่งรายงาน…');
  store.set('reporter', $('in_rep').value.trim());
  try {
    const files = await uploadAll(IN.photos.map(p => ({ name: p.name, get: () => Promise.resolve(p.data) })).concat(IN.files.map(f => ({ name: f.name, get: () => readURL(f.file) }))), 'incident');
    const r = await run('reportIncident', { site: SITE.code, date: $('in_d').value, time: $('in_t').value, type: IN.type, place: place, subject: $('in_s').value.trim(),
      products: IN.products, parcels: parcels, suspects: IN.suspects, detail: $('in_det').value, steps: IN.steps, reporter: $('in_rep').value.trim(), lat: GPS.lat, lng: GPS.lng, files: files });
    ov('<div class="overlay-icon">✅</div><div class="overlay-title">ส่งรายงานเหตุแล้ว</div><div class="overlay-sub">เลขเคส</div><div class="overlay-big">' + esc(r.id) + '</div>' +
      '<div class="overlay-sub">Sec Ops ได้รับเรื่องแล้ว' + (r.owner ? '<br>ผู้รับผิดชอบ: ' + esc(r.owner) : '') + '<br>จดเลขเคสไว้ใช้อ้างอิง</div><button class="overlay-btn" onclick="ovClose();home()">กลับหน้าแรก</button>');
  } catch (e) { showErr('⚠️ ' + errText(e)); }
}

  }).catch(e => toastG(errText(e)));
}

// ═══════════════ ใบนำเข้า-นำออก ที่ป้อม ═══════════════
let GPG = { pt: '', v: null, chk: [], photos: [], how: 'พิมพ์', bad: false };
function formGate() {
  theme('t-bl');
  const pts = SITE.gatePts || ['ป้อมหลัก'];
  GPG.pt = pts.indexOf(store.get('gpPt_' + SITE.code)) > -1 ? store.get('gpPt_' + SITE.code) : pts[0];
  GPG.v = null;
  $('app').innerHTML = '<div class="bl-head"><div class="bl-logo">SEC</div><div><div class="bs">SECURITY OPERATIONS · ' + esc(SITE.code) + '</div><div class="bt">ใบนำเข้า-นำออก</div></div><button type="button" class="pill-back" style="margin-left:auto" onclick="home()">← หน้าแรก</button></div>' +
    '<div class="bl-main">' + (pts.length > 1 ? '<div class="bl-card"><div class="bl-l">จุดตรวจ</div><div class="ph-seg" id="gp_pts">' + pts.map(p => '<button type="button" data-v="' + esc(p) + '">' + esc(p) + '</button>').join('') + '</div></div>' : '') +
    '<div class="bl-card"><div class="bl-l">เลขใบ หรือสแกน QR ที่ผู้นำของแสดง</div><input id="gp_q" class="bl-in" placeholder="GP-… หรือเลขท้าย 4 หลัก" autocomplete="off" style="text-transform:uppercase" onkeydown="if(event.key===\'Enter\')gpGo()">' +
    '<button type="button" class="bl-btn" id="gp_go" onclick="gpGo()">ตรวจสอบ</button><button type="button" class="bl-btn" style="background:#fff;color:#1f2328;border:1.5px solid #d6d9de;margin-top:8px" onclick="gpScan()">📷 สแกน QR ใบผ่าน</button></div><div id="gp_res"></div></div>' +
    '<input type="file" id="gpIn" accept="image/' + '*" capture="environment" style="display:none">';
  if (pts.length > 1) phSeg('gp_pts', GPG.pt, v => { GPG.pt = v; store.set('gpPt_' + SITE.code, v); });
  $('gpIn').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return; shrink(f, 1280, 0.8).then(u => { if (GPG.photos.length < 4) GPG.photos.push(u); gpDraw(); }).catch(() => toastG('อ่านรูปไม่ได้')); });
}
function gpScan() { SCAN_MODE = 'gate'; openScan(null); $('scanMsg').textContent = 'ส่อง QR ใบผ่านที่ผู้นำของแสดง'; }
function gpGotScan(raw) {
  const m = String(raw || '').toUpperCase().match(/GP-[A-Z0-9\/-]+-\d{4}-\d{4}/);
  if (!m) { $('scanMsg').textContent = 'QR นี้ไม่ใช่ใบผ่าน · ลองอีกครั้ง'; return; }
  closeScan(); SCAN_MODE = 'parcel'; if (navigator.vibrate) navigator.vibrate(60);
  $('gp_q').value = m[0]; gpGo('สแกน');
}
function gpGo(how) {
  const q = ($('gp_q').value || '').trim(); if (!q) return;
  GPG.how = how === 'สแกน' ? 'สแกน' : 'พิมพ์';
  const b = $('gp_go'); b.disabled = true; b.textContent = 'กำลังตรวจ…';
  run('gGpFind', SITE.code, q).then(v => { b.disabled = false; b.textContent = 'ตรวจสอบ'; GPG.v = v; GPG.chk = (v.items || []).map(() => false); GPG.photos = []; GPG.bad = false; gpDraw(); $('gp_res').scrollIntoView({ behavior: 'smooth', block: 'start' }); })
    .catch(e => { b.disabled = false; b.textContent = 'ตรวจสอบ'; $('gp_res').innerHTML = '<div class="err" style="display:block">⚠️ ' + esc(errText(e)) + '</div>'; });
}
function gpDraw() {
  const v = GPG.v; if (!v) { $('gp_res').innerHTML = ''; return; }
  if (!v.found) { $('gp_res').innerHTML = '<div class="res r-no"><div class="h">⛔ ไม่พบใบนี้<small>' + esc(v.id) + '</small></div><div class="do"><b>สิ่งที่ต้องทำ</b>ไม่ให้นำของผ่าน · ตรวจเลขใบอีกครั้ง หรือแจ้ง Sec Ops</div></div>'; return; }
  if (!v.ok) { $('gp_res').innerHTML = '<div class="res r-no"><div class="h">⛔ ใช้ไม่ได้<small>' + esc(v.id) + '</small></div><div class="b np"><div class="m">' + esc(v.why) + '<br>' + esc(v.carrier) + ' · ' + esc(v.kind) + '</div></div><div class="do"><b>สิ่งที่ต้องทำ</b>ไม่ให้นำของผ่าน · ให้ผู้ขอติดต่อ Sec Ops</div></div>'; return; }
  const n = GPG.chk.filter(Boolean).length, all = n === v.items.length, title = v.dir === 'นำกลับ' ? '↩ ตรวจนำกลับ' : v.dir === 'นำออก' ? '↗ ตรวจนำออก (รอบสอง)' : '✓ ใบใช้ได้ · ' + v.dir;
  let h = '<div class="res ' + (v.late ? 'r-was' : 'r-ok') + '"><div class="h">' + title + '<small>' + esc(v.id) + '<br>' + (v.late ? 'เกินกำหนด ' + esc(v.due) : esc(v.date)) + '</small></div><div class="b np"><div class="nm">' + esc(v.carrier) + (v.co ? ' · ' + esc(v.co) : '') + (v.plate ? ' · รถ ' + esc(v.plate) : '') + '</div>' +
    '<div class="m">' + esc(v.kind) + ' · ' + esc(v.cat) + ' · ผู้ขอ ' + esc(v.by) + (v.dept ? ' (' + esc(v.dept) + ')' : '') + ' · อนุมัติ ' + esc(v.head) + (v.due && v.dir !== 'นำกลับ' && v.dir !== 'นำออก' ? '<br>' + esc(v.dueLabel || 'ต้องนำกลับภายใน') + ' ' + esc(v.due) : '') + '</div>' +
    '<div class="gp-items">' + v.items.map((it, i) => '<label class="gp-it"><input type="checkbox" ' + (GPG.chk[i] ? 'checked' : '') + ' onchange="GPG.chk[' + i + ']=this.checked;gpDraw()"><span>' + esc(it.d) + (it.sn || it.tag ? '<br><small>' + esc([it.sn ? 'SN ' + it.sn : '', it.tag].filter(Boolean).join(' · ')) + '</small>' : '') + '</span><b>' + esc(it.q) + ' ' + esc(it.u) + '</b></label>').join('') + '</div>' +
    '<button type="button" class="gp-shot" onclick="$(\'gpIn\').click()">📷 ' + (GPG.photos.length ? 'ถ่ายแล้ว ' + GPG.photos.length + ' รูป · ถ่ายเพิ่ม' : 'ถ่ายรูปของ (บังคับ 1 รูป)') + '</button>' +
    (GPG.photos.length ? '<div class="gp-thumbs">' + GPG.photos.map((u, i) => '<img alt="" src="' + u + '" onclick="GPG.photos.splice(' + i + ',1);gpDraw()">').join('') + '</div>' : '') +
    '<input id="gp_note" class="bl-in" style="font-size:15px" placeholder="หมายเหตุ (ถ้ามี)">' +
    '<button type="button" class="bl-btn" ' + (all && GPG.photos.length ? '' : 'disabled style="opacity:.5"') + ' onclick="gpSave(false)">บันทึก' + (v.dir === 'นำกลับ' ? 'นำกลับ' : v.dir) + ' · ครบ ' + n + '/' + v.items.length + '</button>' +
    (!all ? '<button type="button" class="bl-btn" style="background:#fff;color:#b42318;border:1.5px solid #f0b4b4" ' + (GPG.photos.length ? '' : 'disabled') + ' onclick="gpSave(true)">ของไม่ตรง / ไม่ครบ → ไม่ให้ผ่าน แจ้ง Sec Ops</button>' : '') + '</div></div>';
  $('gp_res').innerHTML = h;
}
function gpSave(bad) {
  const by = store.get('name') || ''; if (!by) { const nm = (prompt('ชื่อผู้ตรวจ') || '').trim(); if (!nm) return; store.set('name', nm); }
  const v = GPG.v, note = $('gp_note') ? $('gp_note').value : '';
  busy('กำลังบันทึก…');
  run('gGpSave', SITE.code, { id: v.id, checked: GPG.chk, note: note, photos: GPG.photos, by: store.get('name'), pt: GPG.pt, how: GPG.how, bad: !!bad }).then(r => {
    ovClose(); toastG(r.res === 'ผ่าน' ? 'บันทึก' + (r.dir === 'นำกลับ' ? 'นำกลับ' : r.dir) + 'แล้ว' : 'บันทึกแล้ว · แจ้ง Sec Ops (ไม่ให้ผ่าน)'); GPG.v = null; $('gp_q').value = ''; gpDraw();
  }).catch(e => { ovClose(); toastG(errText(e)); });
}

</script>
</body>
